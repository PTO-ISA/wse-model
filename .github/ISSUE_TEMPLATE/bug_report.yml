---
name: Bug report
description: Report a defect in the WSE model
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. For security issues, use the private
        advisory flow in SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behavior, including the exact command and output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Reference the design document section if the model disagrees with it.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Output of `git rev-parse HEAD`.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and the pyCircuit revision when the ACIR layer is involved.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Smallest descriptor, table, or scenario that shows the defect.
      render: python
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This is not a security report (those go through SECURITY.md).
          required: true
