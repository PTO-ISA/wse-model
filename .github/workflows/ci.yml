name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install -e ".[dev]"
      - name: ruff
        run: python -m ruff check .
      - name: ruff format check
        run: python -m ruff format --check .
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !docs/design/**
            !CHANGELOG.md
      - name: repository hygiene
        run: |
          git diff --check
          test -f LICENSE
          test -f AGENTS.md
          test -f NOTICE

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and contract tests
        run: python -m pytest tests/unit tests/contracts -m "unit or contract" -q
      - name: Integration tests
        run: python -m pytest tests/integration -q
      - name: CLI smoke
        run: |
          wse-model --version
          wse-model topology show
          wse-model calendar encode --key row-allgather --source 0

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run coverage
        run: python -m pytest --cov=wse_model --cov-report=term-missing --cov-report=xml -q
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,docs]"
      - name: Build documentation
        run: python -m mkdocs build --strict

  design-fidelity:
    name: design fidelity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Design sources are present and unmodified
        run: python tools/check_design_sources.py
      - name: Golden vectors
        run: python -m pytest tests/golden -q
