name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install -e ".[dev]"
      - name: ruff
        run: python -m ruff check .
      - name: ruff format check
        run: python -m ruff format --check .
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !docs/design/**
            !CHANGELOG.md
      - name: repository standards
        run: python tools/check_repo_standards.py
      - name: whitespace hygiene
        run: git diff --check

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and contract tests
        run: python -m pytest tests/unit tests/contracts -m "unit or contract" -q
      - name: Integration tests
        run: python -m pytest tests/integration -q
      - name: CLI smoke
        run: |
          wse-model --version
          wse-model topology show
          wse-model calendar encode --key row-allgather --source 0

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run coverage
        run: python -m pytest --cov=wse_model --cov-report=term-missing --cov-report=xml -q
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,docs]"
      - name: Build documentation
        run: python -m mkdocs build --strict

  acir:
    name: acir (opt-in)
    # The agentic_circuit layer needs the pyCircuit native toolchain, which is a
    # long LLVM-linked build. Set the repository variable WSE_MODEL_ACIR_CI=true
    # to enable this job; it is deliberately not a required check.
    if: vars.WSE_MODEL_ACIR_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pyCircuit
        uses: actions/checkout@v4
        with:
          repository: PTO-ISA/pyCircuit
          path: .pycircuit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agentic-circuit frontend
        run: |
          python -m pip install -e .pycircuit/python/semantic-core
          python -m pip install -e .pycircuit/python/agentic-circuit
          python -m pip install -e ".[dev]"
      - name: Build the native ACIR tools
        run: bash tools/build-acir-tools.sh .pycircuit
      - name: ACIR layer tests
        env:
          ACIR_OPT: ${{ github.workspace }}/.pycircuit/.pycircuit_out/toolchain/build/bin/acir-opt
          ACIR_QUEUE_CXXGEN: ${{ github.workspace }}/.pycircuit/.pycircuit_out/toolchain/build/bin/acir-queue-cxxgen
        run: python -m pytest tests/acir -q

  design-fidelity:
    name: design fidelity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Design sources are present and unmodified
        run: python tools/check_design_sources.py
      - name: Golden vectors
        run: python -m pytest tests/golden -q
