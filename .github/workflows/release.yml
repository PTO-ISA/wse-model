name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build the artifacts without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: build distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Resolve the version
        id: version
        run: |
          version="$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/wse_model/version.py').read_text()).group(1))")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${{ steps.version.outputs.version }}"
            exit 1
          fi
      - name: Run the repository gate before packaging
        run: |
          python -m pip install -e ".[dev]"
          make check
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate the metadata
        run: python -m pip install --upgrade twine && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "wse-model ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/*
