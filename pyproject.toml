[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wse-model"
version = "0.1.0"
description = "Architecture-level model of the WSE accelerator: AICORE, NoC + Calendar collectives, Batcher/UB, compiler and runtime semantics"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "PTO-ISA Contributors" }
]
requires-python = ">=3.10"
keywords = [
    "wse",
    "accelerator",
    "architecture-model",
    "noc",
    "calendar",
    "collective-communication",
    "pycircuit",
    "agentic-circuit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Hardware",
]

# The model's semantic core is pure Python and has no runtime dependencies.
# The ACIR model layer requires the `agentic-circuit` frontend, which is
# distributed from the PTO-ISA/pyCircuit checkout rather than PyPI. See
# docs/development/getting-started.md and tools/bootstrap-dev.sh.
dependencies = []

[project.urls]
Homepage = "https://github.com/PTO-ISA/wse-model"
Repository = "https://github.com/PTO-ISA/wse-model"
Issues = "https://github.com/PTO-ISA/wse-model/issues"
Changelog = "https://github.com/PTO-ISA/wse-model/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jsonschema>=4.20.0",
    "ruff>=0.11.0",
    "pre-commit>=3.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[project.scripts]
wse-model = "wse_model.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wse_model = ["py.typed", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/wse_model/acir/**/*.py" = ["N803", "N806", "N815"]
"src/wse_model/cli.py" = ["T201"]
"tests/**/*.py" = ["T201", "N803", "N806"]
"tools/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
files = ["src/wse_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --tb=short"
markers = [
    "unit: fast, pure-Python semantic tests that need no toolchain",
    "contract: interface and schema stability tests",
    "integration: end-to-end model scenarios",
    "acir: tests that require the agentic-circuit frontend and its native tools",
]
