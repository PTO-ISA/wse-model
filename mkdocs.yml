site_name: WSE Model
site_description: Architecture-level model of the WSE accelerator
site_url: https://pto-isa.github.io/wse-model/
repo_url: https://github.com/PTO-ISA/wse-model
repo_name: PTO-ISA/wse-model
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# The pages link to repository files outside docs/ (source modules, the Makefile,
# tests, AGENTS.md) with repository-relative paths. Those links are correct on
# GitHub, which is the canonical reading surface, but MkDocs resolves them as
# documentation pages and would fail a --strict build. Permit them explicitly
# rather than by dropping --strict, so a genuinely missing *page* is still an
# error.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Design sources:
      - System architecture whitepaper v0.1: design/wse-system-architecture-whitepaper.md
      - Calendar scheme: design/wse-calendar-scheme.md
  - Architecture:
      - Overview: architecture/overview.md
      - Calendar and NoC: architecture/calendar-noc.md
      - AICORE: architecture/aicore.md
      - Batcher and UB bus: architecture/batcher-ub.md
      - Runtime and loading: architecture/runtime.md
      - Compiler: architecture/compiler.md
  - Requirements:
      - Index: requirements/index.md
      - Calendar closure: requirements/calendar-closure.md
  - Decisions:
      - Index: decisions/index.md
      - "0001 Adopt the Calendar baseline readings": decisions/0001-adopt-calendar-baseline-defaults.md
      - "0002 Two-layer model with a pure-Python semantic core": decisions/0002-two-layer-model.md
      - "0003 Keep unresolved design items explicit": decisions/0003-keep-open-items-explicit.md
      - "0004 Golden vectors are frozen contracts": decisions/0004-golden-vectors-are-contract.md
      - "0005 Static route-table layout": decisions/0005-static-table-layout.md
      - "0006 Two roofline verdicts": decisions/0006-two-roofline-verdicts.md
  - Development:
      - Getting started: development/getting-started.md
      - Testing and gates: development/testing-and-gates.md
      - Engineering standards: development/engineering-standards.md
  - Reference:
      - CLI: reference/cli.md
      - Descriptors and schemas: reference/descriptors.md
      - Open items: reference/open-items.md
      - Glossary: reference/glossary.md

extra:
  generator: false
