repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: end-of-file-fixer
        exclude: ^(docs/design/|tests/golden/)
      - id: trailing-whitespace
        exclude: ^(docs/design/|tests/golden/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        exclude: ^(docs/design/|CHANGELOG\.md$)

  - repo: local
    hooks:
      - id: wse-model-unit
        name: wse-model unit tests
        entry: python3 -m pytest tests/unit -m unit -q
        language: system
        pass_filenames: false
        files: ^(src/|tests/unit/|schemas/)
